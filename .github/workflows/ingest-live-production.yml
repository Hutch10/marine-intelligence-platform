# Production telemetry activation — scheduled ingest:live against Turso.
# See docs/telemetry-activation/RUNBOOK.md for secrets, monitoring, and verification.

name: Production live ingestion

on:
  schedule:
    # Every 20 minutes (UTC). Aligns with default NDBC scheduler interval.
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: marine-ingest-live-production
  cancel-in-progress: false

jobs:
  ingest-live:
    name: ingest:live → Turso
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingest:live
        working-directory: apps/api
        env:
          NODE_ENV: production
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NDBC_STATION_IDS: ${{ secrets.NDBC_STATION_IDS }}
          CRW_TARGET_REGIONS: ${{ secrets.CRW_TARGET_REGIONS }}
          IOOS_ENABLED: ${{ vars.IOOS_ENABLED || 'false' }}
          ERDDAP_ENABLED: ${{ vars.ERDDAP_ENABLED || 'false' }}
        run: pnpm run ingest:live
